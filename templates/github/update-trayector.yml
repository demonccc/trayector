name: Update Trayector skills

on:
  workflow_dispatch:
    inputs:
      trayector_version:
        description: "Immutable Trayector release version, e.g. 1.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trayector-ai-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download selected AI instructions
        env:
          VERSION: ${{ inputs.trayector_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          source_path="profile-kit/skills/$VERSION"
          destination=".trayector/skills/$VERSION"
          tag="v$VERSION"
          git clone --filter=blob:none --no-checkout https://github.com/demonccc/trayector.git /tmp/trayector-upstream
          git -C /tmp/trayector-upstream fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          mkdir -p /tmp/trayector-incoming
          git -C /tmp/trayector-upstream archive "$tag" "$source_path" | tar -xf - -C /tmp/trayector-incoming
          test -f "/tmp/trayector-incoming/$source_path/index.md"
          if [ -e "$destination" ]; then
            diff -qr "$destination" "/tmp/trayector-incoming/$source_path" || {
              echo "Existing version differs from immutable upstream release. Not overwriting." >&2
              exit 1
            }
          else
            mkdir -p "$(dirname "$destination")"
            cp -R "/tmp/trayector-incoming/$source_path" "$destination"
          fi
          # No changes to ACTIVE, custom/, settings/, site/ or professional data.
      - name: Create version update PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.trayector_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .trayector/skills/)" ]; then
            echo "AI version already installed; nothing to propose."
            exit 0
          fi
          branch="trayector/ai-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- ".trayector/skills/$VERSION"
          git commit -m "chore: install Trayector skills $VERSION"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Install Trayector skills $VERSION" --body "Adds immutable version $VERSION only. ACTIVE and user-managed instructions remain unchanged. Review and activate separately." || {
            gh pr list --head "$branch" --state open
          }
