name: Update Trayector release

on:
  workflow_dispatch:
    inputs:
      trayector_version:
        description: "Immutable Trayector release version, e.g. 1.1.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trayector-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download selected release bundle
        env:
          VERSION: ${{ inputs.trayector_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          destination=".trayector/versions/$VERSION"
          tag="v$VERSION"
          git clone --filter=blob:none --no-checkout https://github.com/demonccc/trayector.git /tmp/trayector-upstream
          git -C /tmp/trayector-upstream fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          mkdir -p /tmp/trayector-incoming
          git -C /tmp/trayector-upstream archive "$tag" skills templates | tar -xf - -C /tmp/trayector-incoming
          test -f /tmp/trayector-incoming/skills/index.md
          test -f /tmp/trayector-incoming/templates/profile.md
          test -f /tmp/trayector-incoming/templates/resumes/basic.md
          if [ -e "$destination" ]; then
            diff -qr "$destination" /tmp/trayector-incoming || {
              echo "Installed release differs from tagged sources. Refusing overwrite." >&2
              exit 1
            }
          else
            mkdir -p "$destination"
            cp -R /tmp/trayector-incoming/skills /tmp/trayector-incoming/templates "$destination/"
          fi
      - name: Align release version and official workflow caller
        env:
          VERSION: ${{ inputs.trayector_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          version=os.environ["VERSION"]
          settings=pathlib.Path(".trayector/settings/trayector.yaml")
          data=settings.read_text()
          new,n=re.subn(r"(?m)^version:.*$", "version: "+version, data)
          if n!=1: raise SystemExit("Expected a top-level version in trayector.yaml")
          settings.write_text(new)
          caller=pathlib.Path(".github/workflows/publish.yml")
          if caller.exists():
              text=caller.read_text()
              updated,n=re.subn(r"(demonccc/trayector/\.github/workflows/publish\.yml@)v[0-9]+\.[0-9]+\.[0-9]+",lambda m:m.group(1)+"v"+version,text)
              if n!=1: raise SystemExit("Expected one official Trayector publish reference; update manually")
              caller.write_text(updated)
          PY
      - name: Create version update PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.trayector_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .trayector/versions/ .trayector/settings/trayector.yaml .github/workflows/publish.yml)" ]; then
            echo "Trayector release already installed; nothing to propose."
            exit 0
          fi
          branch="trayector/update-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -- ".trayector/versions/$VERSION" .trayector/settings/trayector.yaml
          if [ -f .github/workflows/publish.yml ]; then git add -- .github/workflows/publish.yml; fi
          git commit -m "chore: update Trayector release to $VERSION"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Update Trayector to $VERSION" --body "Installs immutable skills and templates $VERSION and aligns declared Trayector version plus official publish reference. Review before merging; customized workflows may require manual resolution." || {
            gh pr list --head "$branch" --state open
          }
